name: Deploy ProtoWiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: read # lets the last step check that Pages is serving gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Patched at site root + stock under codex/stock/ when patches/codex/ holds a patch.
      - name: Build
        run: npm run build
        env:
          PROTOWIKI_BASE: /${{ github.event.repository.name }}/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean-exclude: pr-preview/
          force: false

      # Repos made with "Use this template" don't inherit Pages settings, so the
      # push above can succeed while nothing is published. Fail loudly instead.
      - name: Check GitHub Pages is on
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SETTINGS_URL: ${{ github.server_url }}/${{ github.repository }}/settings/pages
        run: |
          fix="Go to $SETTINGS_URL, choose 'Deploy from a branch', pick 'gh-pages', and press Save. Your site will be live in a minute."

          if ! pages=$(gh api "repos/$REPO/pages" 2>err.txt); then
            if grep -q "HTTP 404" err.txt; then
              echo "::error title=Turn on GitHub Pages to publish your site::$fix"
            else
              echo "::error title=Couldn't check GitHub Pages::$(cat err.txt)"
            fi
            exit 1
          fi

          build_type=$(jq -r '.build_type' <<<"$pages")
          branch=$(jq -r '.source.branch // ""' <<<"$pages")
          path=$(jq -r '.source.path // ""' <<<"$pages")

          if [ "$build_type" != "legacy" ] || [ "$branch" != "gh-pages" ] || [ "$path" != "/" ]; then
            echo "::error title=Change your GitHub Pages setting to publish your site::$fix"
            exit 1
          fi

          echo "::notice title=Your site is live::$(jq -r '.html_url' <<<"$pages")"
