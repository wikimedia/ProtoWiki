name: Build PR preview

# Step 1 of 2 for PR previews. Builds every pull request, including ones from
# forks, with a read-only token, so the PR's code can't write to the repo.
# preview-deploy.yml then publishes the build to gh-pages.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Same as production: patched at preview root, stock under codex/stock/ when patched.
      - name: Install dependencies and build
        if: github.event.action != 'closed'
        run: npm ci && npm run build
        env:
          PROTOWIKI_BASE: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/

      # The deploy workflow can't tell which PR a fork's run belongs to, so the
      # number goes along with the build. Closed PRs upload only the number.
      - name: Record PR number
        run: echo ${{ github.event.number }} > pr-number

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            pr-number
            dist
